<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>掌心足球 · Gesture Football</title>
<style>
  html,body{margin:0;height:100%;background:#041a0c;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#eaffef}
  #video{position:fixed;right:16px;bottom:16px;width:220px;border-radius:12px;transform:scaleX(-1);opacity:.55;border:1px solid #ffffff22;z-index:2}
  #hud{position:fixed;left:16px;top:16px;z-index:3;font-size:13px;line-height:1.6;background:#0008;padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px)}
  #bar{width:160px;height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;margin-top:4px}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#2fd36f,#ffffff)}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:#041a0ccc}
  #start button{font-size:18px;padding:14px 28px;border:0;border-radius:999px;background:linear-gradient(90deg,#1fae57,#0b6b34);color:#fff;cursor:pointer}
  canvas{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="start"><button id="btn">开启摄像头 · 掌控足球</button></div>
<video id="video" playsinline muted></video>
<div id="hud">
  <div id="status">等待摄像头…</div>
  <div>炸开度 <span id="val">0%</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div style="opacity:.6">握拳 = 足球聚合高速旋转 · 张开手掌 = 炸成粒子</div>
</div>
<script>
(function(){

// ---------- Three.js 场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x041a0c);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);



// ---------- 足球粒子 ----------
// 每个粒子两套位置：aBud = 握拳时的完整足球，position = 张开手掌时炸开的位置
const BALL = 22000, DUST = 2500;
const total = BALL + DUST;
const bud = new Float32Array(total * 3);
const bloom = new Float32Array(total * 3);
const color = new Float32Array(total * 3);
const rnd = new Float32Array(total);
const kind = new Float32Array(total); // 0 白块 1 黑五边形/缝线 2 飘散粒子

// 截角二十面体：12 个二十面体顶点 = 黑色五边形中心，20 个面心 = 白色六边形中心
const phi = (1 + Math.sqrt(5)) / 2;
const icoV = [[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]]
  .map(v => new THREE.Vector3(...v).normalize());
const icoF = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]]
  .map(f => icoV[f[0]].clone().add(icoV[f[1]]).add(icoV[f[2]]).normalize());
const centers = icoV.map(v => ({ v, pent: true })).concat(icoF.map(v => ({ v, pent: false })));

const R = 1.3;
const n = new THREE.Vector3();
let i = 0;
for (let k = 0; k < BALL; k++, i++) {
  // 球面均匀分布
  const y = 1 - 2 * (k + 0.5) / BALL, r = Math.sqrt(1 - y * y), a = k * Math.PI * (3 - Math.sqrt(5));
  n.set(Math.cos(a) * r, y, Math.sin(a) * r);
  // 找最近和次近的面中心，判断属于五边形还是六边形，以及是否在缝线上
  let d1 = 9, d2 = 9, best = null;
  for (const c of centers) {
    const d = n.angleTo(c.v);
    if (d < d1) { d2 = d1; d1 = d; best = c; } else if (d < d2) d2 = d;
  }
  const seam = (d2 - d1) < 0.035;
  const dark = best.pent || seam;
  const rr = R * (1 + (Math.random() - 0.5) * 0.015);
  bud.set([n.x * rr, n.y * rr, n.z * rr], i * 3);
  // 炸开：沿法线向外飞出，同一块面片的粒子一起飞，保留拼块感
  const burst = 2.2 + Math.random() * 1.8 + (best.pent ? 0.6 : 0);
  bloom.set([
    best.v.x * burst * 1.2 + n.x * 0.9 + (Math.random() - 0.5) * 0.4,
    best.v.y * burst * 1.2 + n.y * 0.9 + (Math.random() - 0.5) * 0.4,
    best.v.z * burst * 1.2 + n.z * 0.9 + (Math.random() - 0.5) * 0.4,
  ], i * 3);
  if (dark) color.set(seam && !best.pent ? [0.25, 0.28, 0.35] : [0.08, 0.1, 0.16], i * 3);
  else { const w = 0.85 + Math.random() * 0.15; color.set([w, w, w * 1.02], i * 3); }
  rnd[i] = Math.random(); kind[i] = dark ? 1 : 0;
}
// 草屑 / 光点：握拳时贴在球表面，张开时散成一圈
const c = new THREE.Color();
for (let k = 0; k < DUST; k++, i++) {
  const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 2.5;
  bloom.set([Math.cos(a) * r, (Math.random() - 0.5) * 3, Math.sin(a) * r], i * 3);
  n.randomDirection().multiplyScalar(R * 1.02);
  bud.set([n.x, n.y, n.z], i * 3);
  c.setHSL(0.28 + Math.random() * 0.08, 0.8, 0.55 + Math.random() * 0.2);
  color.set([c.r, c.g, c.b], i * 3);
  rnd[i] = Math.random(); kind[i] = 2;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(bloom, 3));
geo.setAttribute('aBud', new THREE.BufferAttribute(bud, 3));
geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));
geo.setAttribute('aKind', new THREE.BufferAttribute(kind, 1));

const uniforms = {
  uTime: { value: 0 },
  uBloom: { value: 0 },
  uFinger: { value: new THREE.Vector3(99, 99, 99) }, // 花朵局部坐标里的指尖
  uPixel: { value: renderer.getPixelRatio() },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: /* glsl */`
    uniform float uTime, uBloom, uPixel;
    uniform vec3 uFinger;
    attribute vec3 aBud, aColor;
    attribute float aRnd, aKind;
    varying vec3 vColor;
    varying float vAlpha;
    float ease(float t){ return t<.5 ? 4.*t*t*t : 1.-pow(-2.*t+2.,3.)/2.; }
    void main(){
      // 每个粒子错开一点时间，绽放有层次感（外层/尖端先动）
      float delay = aRnd * 0.15;
      float t = clamp((uBloom - delay) / (1.0 - 0.15), 0.0, 1.0);
      t = ease(t);
      vec3 p = mix(aBud, position, t);
      // 呼吸与微风扰动
      float w = sin(uTime*1.6 + aRnd*6.283 + p.y*2.0);
      p += vec3(w, cos(uTime*1.3 + aRnd*12.0), sin(uTime + aRnd*9.0)) * (0.015 + 0.03*t);
      if (aKind > 1.5) { // 草屑绕球旋转
        float a = uTime*0.25 + aRnd*6.283;
        p.xz = mat2(cos(a),-sin(a),sin(a),cos(a)) * p.xz;
      }
      // 指尖排斥：手指靠近时粒子被轻轻推开
      vec3 d = p - uFinger;
      float dist = length(d);
      p += normalize(d + 1e-4) * smoothstep(1.2, 0.0, dist) * 0.45 * t;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float size = aKind > 1.5 ? 2.0 : 2.4;
      gl_PointSize = size * uPixel * (6.0 / -mv.z);
      vColor = aColor;
      vAlpha = aKind > 1.5 ? t * 0.8 : (aKind > 0.5 ? 1.0 : 0.6);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor, a * vAlpha);
    }`,
});

const flower = new THREE.Group(); // 足球组
const points = new THREE.Points(geo, mat);
flower.add(points);

scene.add(flower);

// 背景星点
{
  const n = 1500, g = new THREE.BufferGeometry(), a = new Float32Array(n*3);
  for (let k = 0; k < n*3; k++) a[k] = (Math.random()-0.5) * 40;
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.03, color: 0x2f8f4f, transparent: true, opacity: 0.6 })));
}

// ---------- MediaPipe Hands ----------
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const valEl = document.getElementById('val');
const fillEl = document.getElementById('fill');
const state = {
  targetBloom: 0, bloom: 0,
  targetPos: new THREE.Vector3(0, 0, 0), pos: new THREE.Vector3(0, 0, 0),
  finger: new THREE.Vector3(99, 99, 99), hasHand: false, pointer: false,
};
let hands = null, busy = false;
async function initHands() {
  statusEl.textContent = '加载手势模型…';
  hands = new Hands({ locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  hands.onResults(onResults);
  await hands.initialize();
}

async function initCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  video.srcObject = stream;
  await video.play();
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.5);

// 张开程度：指尖到手腕的平均距离 / 手掌尺寸，映射到 0..1
function openness(lm) {
  const palm = dist(lm[0], lm[9]) + 1e-6;
  const tips = [8, 12, 16, 20], mcps = [5, 9, 13, 17];
  let s = 0;
  for (let k = 0; k < 4; k++) s += dist(lm[tips[k]], lm[0]) / dist(lm[mcps[k]], lm[0]);
  s /= 4;                                   // 握拳 ≈ 0.9–1.1，张开 ≈ 1.8–2.1
  const thumb = dist(lm[4], lm[17]) / palm; // 拇指张开加分
  const v = (s - 1.05) / 0.85 * 0.85 + THREE.MathUtils.clamp((thumb - 0.9) / 0.8, 0, 1) * 0.15;
  return THREE.MathUtils.clamp(v, 0, 1);
}

// 归一化图像坐标 → z=0 平面的世界坐标（镜像，和自拍画面一致）
const ndc = new THREE.Vector3(), dir = new THREE.Vector3();
function toWorld(x, y, out) {
  ndc.set((1 - x) * 2 - 1, -(y * 2 - 1), 0.5).unproject(camera);
  dir.copy(ndc).sub(camera.position).normalize();
  const t = -camera.position.z / dir.z;
  return out.copy(camera.position).addScaledVector(dir, t);
}

const tmp = new THREE.Vector3();
function detect() {
  if (!hands || busy || video.readyState < 2) return;
  busy = true;
  hands.send({ image: video }).finally(() => { busy = false; });
}
function onResults(res) {
  const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];
  if (!lm) {
    state.hasHand = false;
    statusEl.textContent = '把手放进画面里 ✋';
    return;
  }
  state.hasHand = true;
  statusEl.textContent = '已识别手部';
  state.targetBloom = openness(lm);
  const cx = (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
  const cy = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
  toWorld(cx, cy - 0.08, state.targetPos);
  toWorld(lm[8].x, lm[8].y, tmp);
  state.finger.copy(flower.worldToLocal(tmp.clone()));
}

// ---------- 主循环 ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  detect();

  if (!state.hasHand) {
    // 没有手时：缓慢自动开合，展示效果
    state.targetBloom = Math.max(0, Math.sin(t * 0.6));
    state.targetPos.set(0, 0, 0);
    state.finger.set(99, 99, 99);
  }
  // 平滑：绽放慢一点更柔和，闭合稍快
  const k = state.targetBloom > state.bloom ? 2.2 : 3.5;
  state.bloom += (state.targetBloom - state.bloom) * (1 - Math.exp(-k * dt));
  state.pos.lerp(state.targetPos, 1 - Math.exp(-6 * dt));

  flower.position.copy(state.pos);
  flower.rotation.y += dt * (2.2 - state.bloom * 1.9);
  flower.rotation.x += dt * (0.9 - state.bloom * 0.8);
  const s = 0.8 + state.bloom * 0.25;
  flower.scale.setScalar(s);

  uniforms.uTime.value = t;
  uniforms.uBloom.value = state.bloom;
  uniforms.uFinger.value.lerp(state.finger, 0.3);

  valEl.textContent = Math.round(state.bloom * 100) + '%';
  fillEl.style.width = state.bloom * 100 + '%';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

document.getElementById('btn').onclick = async () => {
  document.getElementById('start').style.display = 'none';
  try {
    await Promise.all([initCamera(), initHands()]);
    statusEl.textContent = '把手放进画面里 ✋';
  } catch (e) {
    console.error(e);
    statusEl.textContent = '摄像头或模型加载失败：' + (e.message || e) + '（需 localhost/HTTPS 并允许摄像头）';
  }
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
</html>
