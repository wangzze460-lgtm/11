<head>

<title>声控足球 · 全息版</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#bff6ff}
  #stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:9/16;height:100%;max-width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#031826 0%,#000 70%)}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:9;background:#000c;text-align:center}
  #start button{font-size:18px;padding:14px 30px;border:1px solid #39e6ff;border-radius:999px;background:#03303d;color:#dffbff;cursor:pointer;box-shadow:0 0 24px #39e6ff88,inset 0 0 12px #39e6ff55;letter-spacing:2px}
  #start p{margin:0;font-size:13px;opacity:.75;line-height:1.8;padding:0 20px}
  #panel{position:fixed;right:14px;bottom:14px;z-index:8;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #panel button,#panel input{font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid #39e6ff88;background:#021a22e0;color:#dffbff}
  #panel input{width:200px;outline:none}
  #rec.on{background:#5a0010;border-color:#ff3355;box-shadow:0 0 16px #ff3355}
  #tip{position:fixed;left:14px;bottom:14px;z-index:8;font-size:12px;opacity:.6;max-width:260px;line-height:1.7}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

const stage = document.getElementById('stage');
let W = stage.clientWidth, H = stage.clientHeight;

// ---------- 渲染 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
stage.appendChild(renderer.domElement);
const hud = document.createElement('canvas');
stage.appendChild(hud);
const hx = hud.getContext('2d');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
camera.position.set(0, 0, 8);
const VIEW_H = 2 * 8 * Math.tan(25 * Math.PI / 180);
function sizeAll(){
  W = stage.clientWidth; H = stage.clientHeight;
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
  const pr = Math.min(devicePixelRatio, 2); hud.width = W * pr; hud.height = H * pr; hx.setTransform(pr,0,0,pr,0,0);
}
sizeAll();
addEventListener('resize', sizeAll);
const viewW = () => VIEW_H * camera.aspect;

// ---------- 粒子 ----------
const N = 14000;
const cur = new Float32Array(N*3), tgt = new Float32Array(N*3);
const col = new Float32Array(N*3), tcol = new Float32Array(N*3);
const dirA = new Float32Array(N*3), rnd = new Float32Array(N), spd = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const v = new THREE.Vector3().randomDirection();
  dirA.set([v.x, v.y, v.z], i*3);
  rnd[i] = Math.random(); spd[i] = 2.5 + Math.random() * 4;
  cur.set([v.x*6, v.y*6, v.z*6], i*3);
}

// 足球：截角二十面体
const phi = (1 + Math.sqrt(5)) / 2;
const icoV = [[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]].map(v => new THREE.Vector3(...v).normalize());
const icoF = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]].map(f => icoV[f[0]].clone().add(icoV[f[1]]).add(icoV[f[2]]).normalize());
const centers = icoV.map(v => ({v, pent:true})).concat(icoF.map(v => ({v, pent:false})));
const ballP = new Float32Array(N*3), ballC = new Float32Array(N*3);
{
  const R = 1.25, n = new THREE.Vector3();
  for (let k = 0; k < N; k++) {
    const y = 1 - 2*(k+0.5)/N, r = Math.sqrt(1-y*y), a = k*Math.PI*(3-Math.sqrt(5));
    n.set(Math.cos(a)*r, y, Math.sin(a)*r);
    let d1 = 9, d2 = 9, best = null;
    for (const c of centers) { const d = n.angleTo(c.v); if (d < d1) { d2 = d1; d1 = d; best = c; } else if (d < d2) d2 = d; }
    const seam = (d2 - d1) < 0.04;
    ballP.set([n.x*R, n.y*R, n.z*R], k*3);
    if (best.pent) ballC.set([0.05, 0.25, 1.0], k*3);
    else if (seam) ballC.set([0.2, 0.9, 1.0], k*3);
    else ballC.set([0.55, 0.85, 1.0], k*3);
  }
}

// 球员剪影（已采样好的点）
const silPts = [], silBall = [];
{
  const [a, b] = SIL.split('|');
  const bin = atob(a), fl = atob(b);
  const dv = new DataView(new Uint8Array([...bin].map(c => c.charCodeAt(0))).buffer);
  for (let k = 0; k < fl.length; k++) { silPts.push([dv.getInt16(k*4, true)/30000, dv.getInt16(k*4+2, true)/30000]); silBall.push(fl.charCodeAt(k)); }
}

// 文字采样
const tc = document.createElement('canvas'), tx = tc.getContext('2d');
function textPoints(text, maxChars) {
  const lines = [];
  const chars = [...text];
  for (let k = 0; k < chars.length; k += maxChars) lines.push(chars.slice(k, k+maxChars).join(''));
  const fs = 200, lh = 240;
  const font = `900 ${fs}px "PingFang SC","Microsoft YaHei","Heiti SC",Arial,sans-serif`;
  tx.font = font;
  let wmax = 1; lines.forEach(l => wmax = Math.max(wmax, tx.measureText(l).width));
  tc.width = Math.ceil(wmax + 80); tc.height = lh * lines.length + 40;
  tx.fillStyle = '#000'; tx.fillRect(0, 0, tc.width, tc.height);
  tx.fillStyle = '#fff'; tx.textAlign = 'center'; tx.textBaseline = 'middle'; tx.font = font;
  lines.forEach((l, k) => tx.fillText(l, tc.width/2, 20 + lh*k + lh/2));
  const d = tx.getImageData(0, 0, tc.width, tc.height).data, pts = [];
  for (let y = 0; y < tc.height; y += 2) for (let x = 0; x < tc.width; x += 2) if (d[(y*tc.width + x)*4] > 128) pts.push([x - tc.width/2, -(y - tc.height/2)]);
  return { pts, w: wmax, h: tc.height };
}
function shuffle(a){ for (let k = a.length-1; k > 0; k--) { const j = Math.random()*(k+1)|0; [a[k], a[j]] = [a[j], a[k]]; } return a; }

let mode = 'ball', modeUntil = 0, label = '';
function fillFrom(list, from, to, place, colorFn) {
  if (!list.length) list = [[0,0]];
  for (let i = from; i < to; i++) {
    const p = list[(i - from) % list.length], j = (Math.random()-0.5)*0.03;
    const q = place(p);
    tgt.set([q[0]+j, q[1]+j, (Math.random()-0.5)*0.12], i*3);
    tcol.set(colorFn(p, i), i*3);
  }
}
function showText(text, secs) {
  const clean = text.replace(/[，。！？、,.!?\s]/g, '').slice(0, 16) || text;
  const t = textPoints(clean, clean.length > 5 ? 4 : 5);
  shuffle(t.pts);
  const width = viewW() * Math.min(0.86, t.w / 700);
  const s = width / t.w;
  fillFrom(t.pts, 0, N, p => [p[0]*s, p[1]*s + 0.2], p => {
    const u = (p[0]*s / width) + 0.5; return [0.2 + u*0.8, 0.9 - u*0.6, 1.0];
  });
  mode = 'text'; label = clean; modeUntil = performance.now() + (secs || 6) * 1000; kick(0.7);
}
function showPlayer() {
  const nP = Math.floor(N * 0.74);
  const sil = shuffle(silPts.map((p, k) => [p[0], p[1], silBall[k]]));
  const sw = viewW() * 0.95 / 2;
  fillFrom(sil, 0, nP, p => [p[0]*sw, p[1]*sw + 0.9], p => p[2] ? [1.0, 0.85, 0.2] : [0.25, 0.9, 1.0]);
  const t = textPoints('NEYMAR JR 10', 99); shuffle(t.pts);
  const s = viewW() * 0.84 / t.w;
  fillFrom(t.pts, nP, N, p => [p[0]*s, p[1]*s - 1.25], () => [1.0, 0.85, 0.1]);
  mode = 'player'; label = '10 号球员 · 已上线'; modeUntil = performance.now() + 9000; kick(1.0);
}
function showBall() { mode = 'ball'; label = ''; kick(0.5); }

// GPU
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(cur, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('aDir', new THREE.BufferAttribute(dirA, 3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));
const uniforms = { uTime:{value:0}, uBoom:{value:0}, uPixel:{value:renderer.getPixelRatio()} };
const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime,uBoom,uPixel; attribute vec3 aColor,aDir; attribute float aRnd; varying vec3 vC; varying float vA;
    void main(){
      vec3 p = position + aDir * uBoom * (1.2 + aRnd*3.5);
      p += vec3(sin(uTime*2.0+aRnd*40.0), cos(uTime*1.7+aRnd*30.0), 0.0) * 0.012;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_Position = projectionMatrix * mv;
      float tw = 0.75 + 0.25*sin(uTime*6.0 + aRnd*60.0);
      gl_PointSize = (2.0 + aRnd*1.6) * uPixel * (7.0 / -mv.z);
      vC = aColor * tw * (1.0 + uBoom*0.6); vA = 0.55;
    }`,
  fragmentShader:`
    varying vec3 vC; varying float vA;
    void main(){ float d = length(gl_PointCoord-0.5); float a = exp(-d*d*14.0); if(a<0.02) discard; gl_FragColor = vec4(vC*a, a*vA); }`
});
const group = new THREE.Group();
group.add(new THREE.Points(geo, mat));
scene.add(group);
// 背景星尘
{
  const n = 1200, g = new THREE.BufferGeometry(), a = new Float32Array(n*3);
  for (let k = 0; k < n*3; k++) a[k] = (Math.random()-0.5) * 30 - (k%3==2 ? 6 : 0);
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.04, color: 0x1aa6c9, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending })));
}

// ---------- 声音 ----------
let analyser = null, buf = null, micStream = null, level = 0, kickV = 0, mouseDown = false;
function kick(v){ kickV = Math.max(kickV, v); }
async function initMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const src = ac.createMediaStreamSource(micStream);
  analyser = ac.createAnalyser(); analyser.fftSize = 1024; buf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
}
function readLevel() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k]*buf[k];
  const rms = Math.sqrt(s / buf.length);
  return Math.min(1, Math.max(0, (20*Math.log10(rms + 1e-8) + 50) / 40)); // -50dB..-10dB → 0..1
}

// ---------- 语音识别 ----------
let heard = '', heardAt = 0, srOK = false;
function handleSpeech(text) {
  heard = text; heardAt = performance.now();
  if (/你是谁|你是誰|who are you/i.test(text)) showPlayer();
  else if (/足球|变回|回来|football/i.test(text)) showBall();
  else showText(text, 6);
}
function initSR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { heard = '此浏览器不支持语音识别，请用 Edge，或在右下角打字'; heardAt = performance.now(); return; }
  const sr = new SR(); sr.lang = 'zh-CN'; sr.continuous = true; sr.interimResults = false;
  sr.onresult = e => { const r = e.results[e.results.length-1]; if (r.isFinal) handleSpeech(r[0].transcript.trim()); };
  sr.onerror = e => { if (e.error === 'network') { heard = '语音识别连不上网络服务，换 Edge 试试，或打字'; heardAt = performance.now(); } };
  sr.onend = () => { try { sr.start(); } catch(_){} };
  try { sr.start(); srOK = true; } catch(_){}
}
document.getElementById('say').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { handleSpeech(e.target.value.trim()); e.target.value = ''; }
});

// ---------- 鼠标 ----------
const mouseT = new THREE.Vector3(0, 0, 0);
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  mouseT.set(x * viewW() * 0.8, -y * VIEW_H * 0.8, 0);
});
stage.addEventListener('pointerdown', () => mouseDown = true);
addEventListener('pointerup', () => mouseDown = false);
stage.addEventListener('pointerleave', () => mouseT.set(0, 0, 0));

// ---------- HUD ----------
function bracket(x, y, s, dx, dy){ hx.beginPath(); hx.moveTo(x, y+dy*s); hx.lineTo(x, y); hx.lineTo(x+dx*s, y); hx.stroke(); }
function drawHUD(t, boom) {
  hx.clearRect(0, 0, W, H);
  const cx = W/2 + group.position.x / viewW() * W, cy = H/2 - group.position.y / VIEW_H * H;
  hx.lineWidth = 1.2; hx.strokeStyle = 'rgba(57,230,255,.75)'; hx.fillStyle = 'rgba(190,246,255,.9)';
  // 四角
  const m = 18; bracket(m, m, 26, 1, 1); bracket(W-m, m, 26, -1, 1); bracket(m, H-m, 26, 1, -1); bracket(W-m, H-m, 26, -1, -1);
  // 扫描线
  const sy = (t * 120) % H; const g = hx.createLinearGradient(0, sy-40, 0, sy);
  g.addColorStop(0, 'rgba(57,230,255,0)'); g.addColorStop(1, 'rgba(57,230,255,.12)'); hx.fillStyle = g; hx.fillRect(0, sy-40, W, 40);
  // 旋转环（足球模式）
  if (mode === 'ball') {
    const R = 1.25 * (H / VIEW_H) * 1.25 * (1 + boom * 0.8);
    hx.save(); hx.translate(cx, cy);
    for (let k = 0; k < 3; k++) {
      hx.rotate(t * (k % 2 ? -0.6 : 0.9) + k);
      hx.strokeStyle = `rgba(57,230,255,${0.5 - k*0.12})`; hx.setLineDash(k === 1 ? [4, 8] : [30, 14]);
      hx.beginPath(); hx.arc(0, 0, R + k*14, 0, Math.PI * (1.2 + k*0.25)); hx.stroke();
    }
    hx.setLineDash([]); hx.restore();
    hx.fillStyle = 'rgba(190,246,255,.8)'; hx.font = '11px monospace'; hx.textAlign = 'left';
    hx.fillText('TARGET LOCK', cx + R*0.75, cy - R*0.75); hx.fillText(`PWR ${(boom*100|0).toString().padStart(3,'0')}%`, cx + R*0.75, cy - R*0.75 + 14);
  }
  // 顶部标题
  hx.textAlign = 'center'; hx.font = '600 13px monospace'; hx.fillStyle = 'rgba(190,246,255,.9)';
  hx.fillText('◢ VOICE HOLOGRAM SYSTEM ◣', W/2, 34);
  hx.font = '10px monospace'; hx.fillStyle = 'rgba(57,230,255,.7)';
  hx.fillText(new Date().toLocaleTimeString('zh-CN', {hour12:false}) + '  ·  MIC ' + (analyser ? 'ONLINE' : 'OFFLINE') + '  ·  ASR ' + (srOK ? 'ON' : 'OFF'), W/2, 50);
  // 声纹条
  const bars = 32, bw = (W * 0.6) / bars, bx = W*0.2, by = H - 70;
  for (let k = 0; k < bars; k++) {
    const v = analyser ? Math.abs(buf[(k * 29) % buf.length]) * 6 + level * 0.6 : 0.05 + 0.05*Math.sin(t*3+k);
    const h = Math.min(40, 3 + v * 40);
    hx.fillStyle = `rgba(${57 + level*198|0},${230 - level*150|0},255,.8)`;
    hx.fillRect(bx + k*bw, by - h, bw*0.6, h);
  }
  hx.font = '10px monospace'; hx.fillStyle = 'rgba(190,246,255,.7)';
  hx.fillText('VOICE LEVEL ' + (level*100|0) + '%', W/2, by + 14);
  // 识别字幕（打字机效果）
  if (heard && performance.now() - heardAt < 6000) {
    const n = Math.min([...heard].length, ((performance.now() - heardAt) / 60) | 0);
    hx.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif'; hx.fillStyle = '#e8fdff';
    hx.fillText('» ' + [...heard].slice(0, n).join('') + (t % 1 < 0.5 ? '▌' : ''), W/2, H - 110);
  }
  if (label) { hx.font = '600 12px monospace'; hx.fillStyle = 'rgba(255,215,60,.9)'; hx.fillText('[ ' + label + ' ]', W/2, 78); }
}

// ---------- 录制 ----------
const recBtn = document.getElementById('rec');
let recorder = null, chunks = [];
const rc = document.createElement('canvas'), rx = rc.getContext('2d');
function pickType() {
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
recBtn.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  rc.width = 1080; rc.height = 1920;
  const s = rc.captureStream(30);
  if (micStream) micStream.getAudioTracks().forEach(tr => s.addTrack(tr));
  const type = pickType();
  recorder = new MediaRecorder(s, { mimeType: type, videoBitsPerSecond: 12e6 });
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: type || 'video/webm' }));
    a.download = '声控足球_' + Date.now() + '.' + ext; a.click();
    recorder = null; recBtn.classList.remove('on'); recBtn.textContent = '● 录制竖屏视频';
  };
  recorder.start(500); recBtn.classList.add('on'); recBtn.textContent = '■ 停止并保存';
};
function drawRec() {
  if (!recorder) return;
  rx.fillStyle = '#000'; rx.fillRect(0, 0, 1080, 1920);
  const g = rx.createRadialGradient(540, 860, 0, 540, 860, 1300); g.addColorStop(0, '#031826'); g.addColorStop(1, '#000');
  rx.fillStyle = g; rx.fillRect(0, 0, 1080, 1920);
  rx.drawImage(renderer.domElement, 0, 0, 1080, 1920);
  rx.drawImage(hud, 0, 0, 1080, 1920);
}

// ---------- 主循环 ----------
const clock = new THREE.Clock();
let rotY = 0, rotX = 0;
const e = new THREE.Euler(), q = new THREE.Quaternion(), v3 = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
  const raw = readLevel();
  level += (raw - level) * (raw > level ? 0.5 : 0.08);
  if (mode !== 'ball' && now > modeUntil) showBall();

  const voiceBoom = Math.max(0, (level - 0.45) / 0.45);
  kickV *= Math.exp(-dt * 3.5);
  const target = Math.min(1.4, Math.max(voiceBoom * 1.3, mouseDown ? 1 : 0, kickV));
  uniforms.uBoom.value += (target - uniforms.uBoom.value) * (1 - Math.exp(-(target > uniforms.uBoom.value ? 10 : 2.5) * dt));
  const boom = uniforms.uBoom.value;

  if (mode === 'ball') {
    rotY += dt * (1.6 + boom * 3); rotX += dt * 0.5;
    q.setFromEuler(e.set(rotX, rotY, 0));
    for (let i = 0; i < N; i++) {
      v3.set(ballP[i*3], ballP[i*3+1], ballP[i*3+2]).applyQuaternion(q);
      tgt[i*3] = v3.x; tgt[i*3+1] = v3.y; tgt[i*3+2] = v3.z;
    }
    tcol.set(ballC);
  }
  for (let i = 0; i < N; i++) {
    const k = 1 - Math.exp(-spd[i] * dt), i3 = i*3;
    cur[i3] += (tgt[i3] - cur[i3]) * k; cur[i3+1] += (tgt[i3+1] - cur[i3+1]) * k; cur[i3+2] += (tgt[i3+2] - cur[i3+2]) * k;
    col[i3] += (tcol[i3] - col[i3]) * k; col[i3+1] += (tcol[i3+1] - col[i3+1]) * k; col[i3+2] += (tcol[i3+2] - col[i3+2]) * k;
  }
  geo.attributes.position.needsUpdate = true; geo.attributes.aColor.needsUpdate = true;

  const follow = mode === 'ball' ? mouseT : v3.set(0, 0, 0);
  group.position.lerp(follow, 1 - Math.exp(-5 * dt));
  group.rotation.y = mode === 'ball' ? 0 : Math.sin(t * 0.8) * 0.12;
  uniforms.uTime.value = t;

  renderer.render(scene, camera);
  drawHUD(t, boom);
  drawRec();
  requestAnimationFrame(tick);
}
tick();

document.getElementById('btn').onclick = async () => {
  document.getElementById('start').style.display = 'none';
  try { await initMic(); } catch (err) { heard = '麦克风没打开：' + (err.message || err) + '（需 https 或 localhost 并允许麦克风）'; heardAt = performance.now(); }
  initSR();
  showText('你好', 3);
};
})();
</script>
